
name: Build GrimAC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract GrimAC
        run: |
          unzip -q Grim-2.3.74.zip -d source

      - name: Build
        working-directory: source/Grim-2.3.74
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: GrimAC-JAR
          path: source/Grim-2.3.74/**/build/libs/*.jar
          
